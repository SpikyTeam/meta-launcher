<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpikyMC - Minecraft Launcher</title>
    <meta name="description" content="SpikyMC — бесплатный и открытый лаунчер для Minecraft">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://api.github.com">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --green: #52A535;
            --green-dark: #2A641C;
            --green-light: #80D05D;
            --bg: #1a1a1a;
            --bg-card: #262626;
            --border: #353535;
            --text: #eee;
            --text-muted: #999;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        a { color: inherit; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .logo { margin-bottom: 24px; }
        .logo svg { width: 100px; height: 100px; }
        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
        }
        h1 span { color: var(--green-light); }
        .tagline {
            margin-top: 12px;
            font-size: 1.1rem;
            color: var(--text-muted);
            max-width: 520px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            margin-top: 32px;
            padding: 14px 32px;
            background: var(--green);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: background .15s, transform .15s;
        }
        .btn:hover { background: var(--green-dark); transform: translateY(-2px); }
        .btn svg { width: 20px; height: 20px; vertical-align: middle; margin-right: 8px; }

        .download-section {
            margin-top: 48px;
            width: 100%;
            max-width: 800px;
        }
        .download-section h2 {
            font-size: 1.4rem;
            margin-bottom: 24px;
            color: var(--text);
        }
        .platform-group { margin-bottom: 28px; }
        .platform-group h3 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .download-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }
        .download-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: border-color .15s, transform .15s;
        }
        .download-card:hover { border-color: var(--green); transform: translateY(-2px); }
        .download-card .os-icon { width: 48px; height: 48px; color: var(--green-light); margin-bottom: 12px; }
        .download-card .os { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
        .download-card .name { font-size: 1.1rem; font-weight: 700; color: var(--green-light); margin-bottom: 6px; }
        .download-card .size { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
        .download-card .btn-sm {
            display: inline-block;
            padding: 8px 20px;
            background: var(--green);
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background .15s;
        }
        .download-card .btn-sm:hover { background: var(--green-dark); }

        .releases {
            margin-top: 48px;
            width: 100%;
            max-width: 800px;
        }
        .releases h2 {
            font-size: 1.4rem;
            margin-bottom: 16px;
            color: var(--text);
        }
        .release-card {
            display: block;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 12px;
            text-align: left;
            transition: border-color .15s;
        }
        .release-card:hover { border-color: var(--green); }
        .release-card h3 {
            font-size: 1.1rem;
            color: var(--green-light);
            margin-bottom: 6px;
        }
        .release-card .date {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .release-card .body {
            font-size: 0.9rem;
            color: var(--text);
            line-height: 1.6;
            overflow-wrap: break-word;
            word-break: break-word;
        }
        .release-card .body p { margin: 6px 0; }
        .release-card .body ul, .release-card .body ol { margin: 6px 0 6px 20px; padding-left: 16px; }
        .release-card .body li { margin: 2px 0; }
        .release-card .body h1, .release-card .body h2, .release-card .body h3,
        .release-card .body h4, .release-card .body h5, .release-card .body h6 { color: var(--text); margin: 12px 0 6px; }
        .release-card .body code { background: #333; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }
        .release-card .body pre { background: #111; padding: 12px; border-radius: 6px; overflow-x: auto; margin: 8px 0; }
        .release-card .body pre code { background: none; padding: 0; }
        .release-card .body blockquote { border-left: 3px solid var(--green); padding-left: 12px; color: var(--text-muted); margin: 8px 0; }
        .release-card .body img { max-width: 100%; border-radius: 6px; }
        .release-card .body table { width: 100%; border-collapse: collapse; margin: 8px 0; }
        .release-card .body th, .release-card .body td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
        .release-card .body a { color: var(--green-light); }
        .release-card .github-btn {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 16px;
            background: var(--green);
            color: #fff;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background .15s;
        }
        .release-card .github-btn:hover { background: var(--green-dark); }
        .download-card .btn-sm { color: #fff !important; }

        .github-link {
            margin-top: 32px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color .15s;
        }
        .github-link:hover { color: var(--green-light); }

        .loading { color: var(--text-muted); font-size: 0.9rem; margin-top: 16px; }
    </style>
</head>

    <h1>Spiky<span>MC</span></h1>
    <p class="tagline">Бесплатный и открытый лаунчер для Minecraft. Управляйте несколькими установками, модами и Java в одном месте.</p>

    <div class="download-section">
        <h2>Скачать последнюю версию</h2>
        <div id="download-cards"><p class="loading">Загрузка...</p></div>
    </div>

    <div class="releases">
        <h2>Последние релизы</h2>
        <div id="releases-list"><p class="loading">Загрузка...</p></div>
    </div>

    <a class="github-link" href="https://github.com/SpikyTeam/SpikyMC" target="_blank" rel="noopener">
        github.com/SpikyTeam/SpikyMC
    </a>

    <script>
        function getOS() {
            const ua = navigator.userAgent.toLowerCase();
            if (ua.includes('win')) return 'windows';
            if (ua.includes('linux') || ua.includes('ubuntu') || ua.includes('debian')) return 'linux';
            if (ua.includes('mac')) return 'macos';
            return 'unknown';
        }

        function formatSize(bytes) {
            if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(2) + ' GB';
            if (bytes >= 1048576) return (bytes / 1048576).toFixed(2) + ' MB';
            return (bytes / 1024).toFixed(2) + ' KB';
        }

        const assetPatterns = [
            { key: 'windows-setup', label: 'Windows', name: 'Установщик (.exe)', match: (n) => n.endsWith('.exe') },
            { key: 'windows-portable', label: 'Windows', name: 'Portable (.zip)', match: (n) => n.includes('Portable') && n.endsWith('.zip') },
            { key: 'linux-appimage', label: 'Linux', name: 'AppImage', match: (n) => n.endsWith('.AppImage') },
            { key: 'linux-portable', label: 'Linux', name: 'Portable (.tar.gz)', match: (n) => n.endsWith('.tar.gz') },
        ];

        function mapAssets(assets) {
            const result = {};
            for (const asset of assets) {
                for (const pat of assetPatterns) {
                    if (!result[pat.key] && pat.match(asset.name)) {
                        result[pat.key] = asset;
                    }
                }
            }
            return result;
        }

        async function loadLatestRelease() {
            const container = document.getElementById('download-cards');
            try {
                const res = await fetch('https://api.github.com/repos/SpikyTeam/SpikyMC/releases/latest');
                if (!res.ok) throw new Error('Failed');
                const release = await res.json();
                const assets = mapAssets(release.assets);

                const os = getOS();
                const platforms = [
                    { label: 'Windows', keys: ['windows-setup', 'windows-portable'] },
                    { label: 'Linux', keys: ['linux-appimage', 'linux-portable'] },
                ];

                const osIcons = { Windows: 'icon-windows', Linux: 'icon-linux' };
                const html = platforms.map(p => {
                    const icon = osIcons[p.label];
                    const cards = p.keys.map(key => {
                        const asset = assets[key];
                        const pat = assetPatterns.find(pp => pp.key === key);
                        if (!asset) return '';
                        return `
                            <div class="download-card">
                                <svg class="os-icon"><use href="#${icon}"/></svg>
                                <div class="name">${pat.name}</div>
                                <div class="size">${formatSize(asset.size)}</div>
                                <a class="btn-sm" href="${asset.browser_download_url}" target="_blank" rel="noopener">Скачать</a>
                            </div>
                        `;
                    }).join('');
                    return `<div class="platform-group"><h3>${p.label}</h3><div class="download-cards">${cards}</div></div>`;
                }).join('');

                container.innerHTML = html || '<p class="loading">Нет доступных загрузок</p>';
            } catch (e) {
                container.innerHTML = '<p class="loading">Не удалось загрузить</p>';
            }
        }

        async function loadReleases() {
            const list = document.getElementById('releases-list');
            try {
                const res = await fetch('https://api.github.com/repos/SpikyTeam/SpikyMC/releases?per_page=5');
                if (!res.ok) throw new Error('Failed');
                const releases = await res.json();
                if (releases.length === 0) {
                    list.innerHTML = '<p class="loading">Релизов пока нет</p>';
                    return;
                }
                list.innerHTML = releases.map(r => {
                    const date = new Date(r.published_at).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
                    const body = r.body ? marked.parse(r.body) : '<p>Без описания</p>';
                    return `
                        <div class="release-card">
                            <h3>${r.name}</h3>
                            <div class="date">${date}</div>
                            <div class="body">${body}</div>
                            <a class="github-btn" href="${r.html_url}" target="_blank" rel="noopener">Открыть на GitHub</a>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                list.innerHTML = '<p class="loading">Не удалось загрузить релизы</p>';
            }
        }

        loadLatestRelease();
        loadReleases();
    </script>
