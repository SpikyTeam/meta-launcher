name: Generate meta

on:
  schedule:
    # daily, off the top of the hour to avoid the scheduler congestion
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  # the generated meta is committed back to this repository, which in turn
  # triggers the "Build Pages" workflow
  contents: write

concurrency:
  group: meta
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the generator
        uses: actions/checkout@v6
        with:
          repository: SpikyTeam/meta
          path: generator

      - name: Check out the launcher meta
        uses: actions/checkout@v6
        with:
          path: launcher
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the generator
        run: pip install "pydantic<2" cachecontrol requests filelock packaging

      - name: Clone the upstream cache
        run: git clone https://github.com/SpikyTeam/meta-upstream.git upstream

      - name: Generate the meta tree
        env:
          # update.sh runs from the generator directory, so these have to be
          # absolute -- it resolves them against its own working directory
          META_UPSTREAM_DIR: ${{ github.workspace }}/upstream
          META_LAUNCHER_DIR: ${{ github.workspace }}/launcher
          META_CACHE_DIR: ${{ github.workspace }}/caches
          # the commit and the push are done below with GITHUB_TOKEN, which only
          # has access to this repository
          DEPLOY_TO_GIT: "false"
        run: |
          set -euo pipefail
          cd generator
          ./update.sh

      - name: Commit the generated meta
        run: |
          set -euo pipefail
          cd launcher
          git config user.name "SpikyTeam Meta Bot"
          git config user.email "meta-bot@spiky.team"
          # only the meta tree, never the static site tree
          git add index.json com.* net.* org.*
          if git diff --cached --quiet; then
            echo "meta is already up to date"
            exit 0
          fi
          git commit -m "Update $(date -I)"
          git push origin HEAD:master

  build:
    needs: generate
    # the push above uses GITHUB_TOKEN, which does not raise a push event, so the
    # site has to be rebuilt from this run
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
      pages: write
      id-token: write