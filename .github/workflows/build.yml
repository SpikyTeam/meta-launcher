name: Build Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
  # the generator calls this after it pushes the meta, because a push made with
  # GITHUB_TOKEN does not raise a workflow event
  workflow_call:

permissions:
  # actions-gh-pages pushes the built site to the gh-pages branch
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # when this runs as a called workflow the commit is the one that
          # triggered the caller, which predates the meta the generator pushed,
          # so always build the current tip of master
          ref: master

      - name: Assemble site
        run: |
          set -euo pipefail
          # Build outside the checkout: the glob below must never see the
          # output directory, or it moves _site into itself.
          rm -rf "$RUNNER_TEMP/_site"
          mkdir -p "$RUNNER_TEMP/_site/meta/v1"
          for entry in * .[^.]*; do
            case "$entry" in
              static|.github) continue ;;
              # the checkout's own repo must stay put: moving it into the
              # output makes git treat meta/v1 as a nested repository
              # (mode 160000) and drop its contents from the site
              .git) continue ;;
            esac
            mv "$entry" "$RUNNER_TEMP/_site/meta/v1/"
          done
          cp -r static/. "$RUNNER_TEMP/_site/"
          rm -rf static
          cp .github/CNAME "$RUNNER_TEMP/_site/CNAME"
          mv "$RUNNER_TEMP/_site" _site

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./_site
          github_token: ${{ secrets.GITHUB_TOKEN }}
